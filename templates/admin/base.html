{% extends 'base.html' %}
{% block body %}

<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i class="fas fa-university me-2"></i>UCSP Admin
    </div>
    <nav class="sidebar-nav">
      <a href="{{ url_for('admin_dash') }}"   class="nav-link {% block m_dash   %}{% endblock %}"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
      <a href="{{ url_for('add_faculty') }}"  class="nav-link {% block m_addfac %}{% endblock %}"><i class="fas fa-user-plus"></i><span>Add Faculty</span></a>
      <a href="{{ url_for('view_faculty') }}" class="nav-link {% block m_viewfac %}{% endblock %}"><i class="fas fa-users"></i><span>View Faculty</span></a>
      <a href="{{ url_for('admin_bus') }}"    class="nav-link {% block m_bus    %}{% endblock %}"><i class="fas fa-bus"></i><span>Bus Routes</span></a>
      <a href="{{ url_for('admin_events') }}" class="nav-link {% block m_events %}{% endblock %}"><i class="fas fa-calendar-alt"></i><span>Events</span></a>
      <a href="{{ url_for('admin_placed') }}" class="nav-link {% block m_placed %}{% endblock %}"><i class="fas fa-briefcase"></i><span>Placed Students</span></a>
      <a href="{{ url_for('admin_rank') }}"   class="nav-link {% block m_rank   %}{% endblock %}"><i class="fas fa-trophy"></i><span>Rank Holders</span></a>
    </nav>
    <div class="sidebar-footer">
      <a href="{{ url_for('index') }}" class="nav-link"><i class="fas fa-home"></i><span>Home</span></a>
      <a href="{{ url_for('logout') }}" class="nav-link text-danger"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="admin-main">
    <!-- TOPBAR -->
    <div class="admin-topbar">
      <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="topbar-title">{% block page_title %}Dashboard{% endblock %}</div>
      <div class="topbar-user">
        <i class="fas fa-user-shield me-1"></i>
        <span>{{ session.get('name','Admin') }}</span>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="admin-content">
      {% block content %}{% endblock %}
    </div>
  </div>

</div>

<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}
</script>
{% endblock %}
